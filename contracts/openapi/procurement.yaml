openapi: 3.0.3
info:
  title: Procurement Service
  description: >
    The decision/commitment engine for what the business buys (FR-2.1–FR-2.8).
    Locks unit cost and payment terms onto a PO at creation time by calling
    Vendor Management (REST), enforces a value-based approval workflow
    (D-1), publishes PurchaseOrderApproved, and consumes GoodsReceived to track received quantities and move POs to Partially Received / Closed (FR-2.5, D-6). Owns its own Postgres
    database.
  version: 0.1.0
servers:
  - url: http://localhost:3002
tags:
  - name: reports
  - name: health
  - name: purchase-orders
  - name: reorder-suggestions
paths:
  /health:
    get:
      tags: [health]
      summary: Liveness/readiness probe. Always reachable regardless of feature flag state.
      responses:
        "200":
          description: Service is up.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  service: { type: string, example: procurement }
                  timestamp: { type: string, format: date-time }
  /purchase-orders:
    get:
      tags: [purchase-orders]
      summary: List purchase orders (Procurement Dashboard)
      parameters:
        - in: query
          name: status
          schema: { $ref: "#/components/schemas/PurchaseOrderStatus" }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - in: query
          name: q
          description: Search — matches PO number or supplier name (case-insensitive).
          schema: { type: string, maxLength: 100 }
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/ExportFormat"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, total, page, pageSize]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/PurchaseOrder" }
                  total: { type: integer, description: Rows matching the filters }
                  page: { type: integer }
                  pageSize: { type: integer }
            text/csv:
              schema: { type: string, format: binary }
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
    post:
      tags: [purchase-orders]
      summary: >
        Create a draft PO (FR-2.1). Fetches supplier pricing/terms from
        Vendor Management and freezes them onto the PO lines (FR-2.2) —
        prices are never re-fetched after this point.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePurchaseOrderDto" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PurchaseOrder" }
  /purchase-orders/{id}:
    get:
      tags: [purchase-orders]
      summary: Get a purchase order and its lines
      parameters:
        - $ref: "#/components/parameters/PurchaseOrderId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PurchaseOrder" }
        "404": { description: Not found }
  /purchase-orders/{id}/submit:
    post:
      tags: [purchase-orders]
      summary: Draft -> Pending Approval (FR-2.4)
      parameters:
        - $ref: "#/components/parameters/PurchaseOrderId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PurchaseOrder" }
  /purchase-orders/{id}/approve:
    post:
      tags: [purchase-orders]
      summary: >
        Pending Approval -> Approved (FR-2.3, D-1). The signed-in user is
        the approver and their role comes from the session (D-16): MANAGER
        below PO_APPROVAL_THRESHOLD_KES, OWNER at/above it; any other role
        gets 403. No request body. Publishes PurchaseOrderApproved on success
        (FR-2.6).
      parameters:
        - $ref: "#/components/parameters/PurchaseOrderId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PurchaseOrder" }
        "403":
          description: Approver role insufficient for this PO's total amount.
  /purchase-orders/{id}/mark-sent:
    post:
      tags: [purchase-orders]
      summary: Approved -> Sent (PO has been transmitted to the supplier)
      parameters:
        - $ref: "#/components/parameters/PurchaseOrderId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PurchaseOrder" }
  /purchase-orders/lookup/{poNumber}:
    get:
      tags: [purchase-orders]
      summary: >
        Server side of FR-3.1 — Receiving calls this (REST, sync) to
        validate an open, approved PO exists for a delivery before accepting
        it. Only returns POs in APPROVED, SENT, or PARTIALLY_RECEIVED state.
      parameters:
        - in: path
          name: poNumber
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PurchaseOrder" }
        "404": { description: No open PO with that number. }
  /purchase-orders/by-number/{poNumber}:
    get:
      tags: [purchase-orders]
      summary: >
        Record lookup by PO number in any status. Financials calls this
        (FR-8.1) to value a GoodsReceived at the PO's frozen unit costs and
        payment terms — by then the PO may already be CLOSED, which the
        lookup endpoint above refuses.
      parameters:
        - in: path
          name: poNumber
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PurchaseOrder" }
        "404": { description: No PO with that number. }
  /reorder-suggestions:
    get:
      tags: [reorder-suggestions]
      summary: >
        FR-2.7 — reorder suggestions surfaced from consumed StockLow events.
        A human still creates the PO; this is advisory only (no
        auto-ordering).
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - in: query
          name: q
          description: Search — matches SKU.
          schema: { type: string, maxLength: 100 }
        - $ref: "#/components/parameters/ExportFormat"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, total, page, pageSize]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ReorderSuggestion" }
                  total: { type: integer, description: Rows matching the filters }
                  page: { type: integer }
                  pageSize: { type: integer }
            text/csv:
              schema: { type: string, format: binary }
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
  /reorder-suggestions/{id}/dismiss:
    post:
      tags: [reorder-suggestions]
      summary: Dismiss a reorder suggestion without acting on it
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReorderSuggestion" }
  /reports/supplier-performance:
    get:
      tags: [reports]
      summary: >
        D-20 — per supplier, for POs approved between from and to (approved,
        sent, partially received or closed): orders, KES spend (other
        currencies counted, never converted), units ordered vs received,
        and fill rate on closed POs (over-delivery capped). OWNER, MANAGER,
        BUYER or ACCOUNTANT.
      parameters:
        - { in: query, name: from, required: true, schema: { type: string, format: date } }
        - { in: query, name: to, required: true, schema: { type: string, format: date } }
        - $ref: "#/components/parameters/ExportFormat"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SupplierPerformance" }
            text/csv:
              schema: { type: string, format: binary }
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
components:
  parameters:
    Page:
      in: query
      name: page
      description: 1-based page number.
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      in: query
      name: pageSize
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    ExportFormat:
      in: query
      name: format
      description: >
        Download every matching row (up to 50,000) as a file instead of a
        page. Paging params are ignored; filters and q apply.
      schema: { type: string, enum: [csv, xlsx] }
    From:
      in: query
      name: from
      description: YYYY-MM-DD, inclusive (UTC day).
      schema: { type: string, format: date }
    To:
      in: query
      name: to
      description: YYYY-MM-DD, inclusive (UTC day).
      schema: { type: string, format: date }
    PurchaseOrderId:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }
  schemas:
    SupplierPerformance:
      type: object
      properties:
        supplierId: { type: string }
        supplierName: { type: string }
        purchaseOrders: { type: integer }
        openOrders: { type: integer }
        closedOrders: { type: integer }
        spendKes: { type: number }
        otherCurrencyOrders: { type: integer }
        unitsOrdered: { type: integer }
        unitsReceived: { type: integer }
        fillRate: { type: number, nullable: true, description: 0–1 on closed POs; null until one closes }
    PurchaseOrderStatus:
      type: string
      enum:
        [
          DRAFT,
          PENDING_APPROVAL,
          APPROVED,
          SENT,
          PARTIALLY_RECEIVED,
          CLOSED,
        ]
    PurchaseOrderLine:
      type: object
      properties:
        id: { type: string, format: uuid }
        sku: { type: string }
        productName: { type: string }
        quantityOrdered: { type: integer }
        quantityReceived:
          type: integer
          description: >
            Running total of units that physically arrived (good + damaged),
            updated from consumed GoodsReceived events (FR-2.5, D-6). When
            every line is fully received the PO moves to CLOSED; until then
            any receipt moves it to PARTIALLY_RECEIVED.
        unitCost:
          type: number
          format: float
          description: Frozen at PO creation time; never re-fetched (FR-2.2).
    PurchaseOrder:
      type: object
      properties:
        id: { type: string, format: uuid }
        poNumber: { type: string, example: PO-1001 }
        supplierId: { type: string, format: uuid }
        supplierName: { type: string }
        status: { $ref: "#/components/schemas/PurchaseOrderStatus" }
        paymentTermsDays: { type: integer }
        currency: { type: string }
        totalAmount: { type: number, format: float }
        requestedById: { type: string }
        approvedById: { type: string, nullable: true }
        approvedAt: { type: string, format: date-time, nullable: true }
        lines:
          type: array
          items: { $ref: "#/components/schemas/PurchaseOrderLine" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreatePurchaseOrderDto:
      type: object
      description: The signed-in user is recorded as requestedById (D-16).
      required: [supplierId, lines]
      properties:
        supplierId: { type: string, format: uuid }
        lines:
          type: array
          items:
            type: object
            required: [sku, quantityOrdered]
            properties:
              sku: { type: string }
              quantityOrdered: { type: integer }
    ReorderSuggestion:
      type: object
      properties:
        id: { type: string, format: uuid }
        sku: { type: string }
        reason: { type: string }
        sourceEventId: { type: string }
        status: { type: string, enum: [NEW, DISMISSED, CONVERTED] }
        createdAt: { type: string, format: date-time }
