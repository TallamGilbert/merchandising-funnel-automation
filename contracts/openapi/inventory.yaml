openapi: 3.0.3
info:
  title: Inventory Service
  description: >
    Single source of truth for stock levels, valuation, and product master
    data (FR-4.1–FR-4.8). Owns its own Postgres database. The real-time
    checkout stock check used by Retail Sales is gRPC, not REST — see
    contracts/proto/inventory.proto — because it is the one latency-sensitive
    sync path in the system (NFR-5). Everything else here is REST.
  version: 0.1.0
servers:
  - url: http://localhost:3003
tags:
  - name: health
  - name: products
  - name: stock-levels
  - name: stock-counts
  - name: valuation
paths:
  /health:
    get:
      tags: [health]
      summary: Liveness/readiness probe. Always reachable regardless of feature flag state.
      responses:
        "200":
          description: Service is up.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  service: { type: string, example: inventory }
                  timestamp: { type: string, format: date-time }
  /products:
    get:
      tags: [products]
      summary: List products (Inventory Control Center)
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - in: query
          name: q
          description: Search — matches SKU or name.
          schema: { type: string, maxLength: 100 }
        - in: query
          name: category
          description: Exact category, case-insensitive.
          schema: { type: string }
        - $ref: "#/components/parameters/ExportFormat"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, total, page, pageSize]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Product" }
                  total: { type: integer, description: Rows matching the filters }
                  page: { type: integer }
                  pageSize: { type: integer }
            text/csv:
              schema: { type: string, format: binary }
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
    post:
      tags: [products]
      summary: Create a product master record
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateProductDto" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
  /products/{sku}:
    get:
      tags: [products]
      summary: >
        Get a product's attributes, sales velocity, and stock levels across
        all locations. Also serves FR-4.7 (Warehouse Ops item-attribute
        lookup).
      parameters:
        - $ref: "#/components/parameters/Sku"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductDetail" }
        "404": { description: Not found }
    patch:
      tags: [products]
      summary: Update product attributes / unit cost (manual adjustment)
      parameters:
        - $ref: "#/components/parameters/Sku"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateProductDto" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
  /products/{sku}/bin-locations/{binCode}:
    put:
      tags: [products]
      summary: >
        FR-5.7 — Warehouse Operations confirms the final bin location once
        putaway completes. Inventory only records the bin; it never decides
        placement. Sets the bin's absolute quantity for this SKU, so retries
        are idempotent; a quantity of 0 removes the record.
      parameters:
        - $ref: "#/components/parameters/Sku"
        - in: path
          name: binCode
          required: true
          schema: { type: string, example: A-01-03 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetBinLocationDto" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BinLocation" }
        "404": { description: Product not found }
  /products/{sku}/adjustments:
    post:
      tags: [stock-levels]
      summary: >
        Manual stock adjustment (FR-4.8) — a one-off correction; whole
        counts go through /stock-counts. Writes the level change and an
        InventoryTransaction of type ADJUSTMENT together, and publishes
        StockAdjusted (kind MANUAL) so Financials books the value (D-19).
        OWNER or MANAGER.
      parameters:
        - $ref: "#/components/parameters/Sku"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StockAdjustmentDto" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StockLevel" }
  /stock-levels:
    get:
      tags: [stock-levels]
      summary: Browse stock levels across products, optionally filtered by location
      parameters:
        - in: query
          name: locationCode
          schema: { type: string }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - in: query
          name: q
          description: Search — matches SKU or product name.
          schema: { type: string, maxLength: 100 }
        - $ref: "#/components/parameters/ExportFormat"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, total, page, pageSize]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/StockLevel" }
                  total: { type: integer, description: Rows matching the filters }
                  page: { type: integer }
                  pageSize: { type: integer }
            text/csv:
              schema: { type: string, format: binary }
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
  /stock-counts:
    get:
      tags: [stock-counts]
      summary: Stock counts, newest first, with progress and variance totals (D-19)
      parameters:
        - in: query
          name: status
          schema: { $ref: "#/components/schemas/StockCountStatus" }
        - in: query
          name: locationCode
          schema: { type: string }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - in: query
          name: q
          description: Search — matches the count number.
          schema: { type: string, maxLength: 100 }
        - $ref: "#/components/parameters/ExportFormat"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, total, page, pageSize]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/StockCount" }
                  total: { type: integer, description: Rows matching the filters }
                  page: { type: integer }
                  pageSize: { type: integer }
            text/csv:
              schema: { type: string, format: binary }
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
    post:
      tags: [stock-counts]
      summary: >
        Start a count (OWNER or MANAGER). FULL counts every product held at
        the location; CYCLE counts the given SKUs or category. Each line
        freezes the product's current on-hand as its expected quantity. Only
        one OPEN or SUBMITTED count per location (409 otherwise).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateStockCountDto" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StockCountDetail" }
        "400": { description: Scope doesn't match the type, or nothing to count }
        "404": { description: Unknown SKU }
        "409": { description: Another count is still active at this location }
  /stock-counts/suggestions:
    get:
      tags: [stock-counts]
      summary: >
        What to cycle-count next at a location: products in stock there,
        never counted first, then longest since their last posted count,
        ties by stock value.
      parameters:
        - in: query
          name: locationCode
          required: true
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CountSuggestion" }
  /stock-counts/{id}:
    get:
      tags: [stock-counts]
      summary: >
        A count and its lines. On an OPEN blind count, anyone but an OWNER or
        MANAGER gets expectedQty, variance and the variance totals as null
        (expectedHidden true).
      parameters:
        - $ref: "#/components/parameters/StockCountId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StockCountDetail" }
        "404": { description: Not found }
  /stock-counts/{id}/lines/{sku}:
    put:
      tags: [stock-counts]
      summary: >
        Record what was found for a SKU (OWNER, MANAGER or WAREHOUSE_STAFF;
        count must be OPEN). A repeat entry replaces the earlier one. A SKU
        not on the count is added, expecting its current on-hand.
      parameters:
        - $ref: "#/components/parameters/StockCountId"
        - $ref: "#/components/parameters/Sku"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecordCountDto" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StockCountDetail" }
        "404": { description: Unknown count or SKU }
        "409": { description: The count is no longer open }
  /stock-counts/{id}/submit:
    post:
      tags: [stock-counts]
      summary: OPEN -> SUBMITTED, ready for a manager to review (OWNER, MANAGER or WAREHOUSE_STAFF)
      parameters:
        - $ref: "#/components/parameters/StockCountId"
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubmitStockCountDto" }
      responses:
        "201":
          description: Submitted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StockCountDetail" }
        "400": { description: Lines are uncounted and uncounted is reject }
        "409": { description: Not open }
  /stock-counts/{id}/post:
    post:
      tags: [stock-counts]
      summary: >
        SUBMITTED -> POSTED (OWNER or MANAGER). In one transaction, adds each
        counted line's variance (counted - expected) to current on-hand and
        writes an ADJUSTMENT transaction referencing the count number; then
        publishes StockAdjusted (kind STOCK_COUNT) for Financials. Refuses
        with 409, changing nothing, if a line would go below zero.
      parameters:
        - $ref: "#/components/parameters/StockCountId"
      responses:
        "201":
          description: Posted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StockCountDetail" }
        "409": { description: Not submitted, or a line would go negative }
  /stock-counts/{id}/cancel:
    post:
      tags: [stock-counts]
      summary: Cancel an OPEN or SUBMITTED count; nothing is adjusted (OWNER or MANAGER)
      parameters:
        - $ref: "#/components/parameters/StockCountId"
      responses:
        "201":
          description: Cancelled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StockCountDetail" }
        "409": { description: Already posted or cancelled }
  /valuation:
    get:
      tags: [valuation]
      summary: Inventory valuation report (FR-4.4, FR-4.8)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValuationReport" }
components:
  parameters:
    Page:
      in: query
      name: page
      description: 1-based page number.
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      in: query
      name: pageSize
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    ExportFormat:
      in: query
      name: format
      description: >
        Download every matching row (up to 50,000) as a file instead of a
        page. Paging params are ignored; filters and q apply.
      schema: { type: string, enum: [csv, xlsx] }
    From:
      in: query
      name: from
      description: YYYY-MM-DD, inclusive (UTC day).
      schema: { type: string, format: date }
    To:
      in: query
      name: to
      description: YYYY-MM-DD, inclusive (UTC day).
      schema: { type: string, format: date }
    StockCountId:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }
    Sku:
      in: path
      name: sku
      required: true
      schema: { type: string }
  schemas:
    Product:
      type: object
      properties:
        id: { type: string, format: uuid }
        sku: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        lengthCm: { type: number, format: float, nullable: true }
        widthCm: { type: number, format: float, nullable: true }
        heightCm: { type: number, format: float, nullable: true }
        weightKg: { type: number, format: float, nullable: true }
        unitCost: { type: number, format: float }
        category: { type: string, nullable: true, example: Sofas }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ProductDetail:
      allOf:
        - $ref: "#/components/schemas/Product"
        - type: object
          properties:
            stockLevels:
              type: array
              items: { $ref: "#/components/schemas/StockLevel" }
            salesVelocity: { $ref: "#/components/schemas/SalesVelocity" }
            binLocations:
              type: array
              description: Bin locations confirmed by Warehouse Operations (FR-5.7).
              items: { $ref: "#/components/schemas/BinLocation" }
    StockCountType:
      type: string
      enum: [FULL, CYCLE]
    StockCountStatus:
      type: string
      enum: [OPEN, SUBMITTED, POSTED, CANCELLED]
    StockCount:
      type: object
      description: A count with progress and variance totals (variance values at each line's unit cost, KES).
      properties:
        id: { type: string, format: uuid }
        countNumber: { type: string, example: SC-1001 }
        locationCode: { type: string, example: WH-MAIN }
        type: { $ref: "#/components/schemas/StockCountType" }
        status: { $ref: "#/components/schemas/StockCountStatus" }
        blind: { type: boolean }
        notes: { type: string, nullable: true }
        createdById: { type: string }
        submittedById: { type: string, nullable: true }
        submittedAt: { type: string, format: date-time, nullable: true }
        postedById: { type: string, nullable: true }
        postedAt: { type: string, format: date-time, nullable: true }
        cancelledById: { type: string, nullable: true }
        cancelledAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        lineCount: { type: integer }
        countedLines: { type: integer }
        linesWithVariance: { type: integer, nullable: true }
        unitsOver: { type: integer, nullable: true }
        unitsShort: { type: integer, nullable: true }
        varianceValue: { type: number, nullable: true }
    StockCountLine:
      type: object
      properties:
        id: { type: string, format: uuid }
        sku: { type: string }
        productName: { type: string }
        expectedQty: { type: integer, nullable: true, description: null while hidden on a blind count }
        countedQty: { type: integer, nullable: true, description: null until counted }
        variance: { type: integer, nullable: true }
        countedById: { type: string, nullable: true }
        countedAt: { type: string, format: date-time, nullable: true }
        unitCost: { type: number, format: float }
    StockCountDetail:
      allOf:
        - $ref: "#/components/schemas/StockCount"
        - type: object
          properties:
            expectedHidden: { type: boolean }
            lines:
              type: array
              items: { $ref: "#/components/schemas/StockCountLine" }
    CreateStockCountDto:
      type: object
      required: [locationCode, type]
      properties:
        locationCode: { type: string, example: WH-MAIN }
        type: { $ref: "#/components/schemas/StockCountType" }
        skus:
          type: array
          maxItems: 500
          items: { type: string }
          description: CYCLE only — the SKUs to count.
        category: { type: string, description: CYCLE only — every product in this category. }
        blind: { type: boolean, default: true }
        notes: { type: string, maxLength: 500 }
    RecordCountDto:
      type: object
      required: [countedQty]
      properties:
        countedQty: { type: integer, minimum: 0 }
    SubmitStockCountDto:
      type: object
      properties:
        uncounted:
          type: string
          enum: [reject, skip, zero]
          default: reject
          description: Refuse while lines are uncounted, leave them out, or record them as 0 found.
    CountSuggestion:
      type: object
      properties:
        sku: { type: string }
        productName: { type: string }
        onHand: { type: integer }
        stockValue: { type: number }
        lastCountedAt: { type: string, format: date-time, nullable: true }
    CreateProductDto:
      type: object
      required: [sku, name, unitCost]
      properties:
        sku: { type: string }
        name: { type: string }
        description: { type: string }
        lengthCm: { type: number, format: float }
        widthCm: { type: number, format: float }
        heightCm: { type: number, format: float }
        weightKg: { type: number, format: float }
        unitCost: { type: number, format: float }
        category:
          type: string
          maxLength: 60
          description: Grouping for cycle counts and sales-by-category reports.
    UpdateProductDto:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        lengthCm: { type: number, format: float }
        widthCm: { type: number, format: float }
        heightCm: { type: number, format: float }
        weightKg: { type: number, format: float }
        unitCost: { type: number, format: float }
    StockLevel:
      type: object
      properties:
        productId: { type: string, format: uuid }
        sku: { type: string }
        productName: { type: string }
        locationCode: { type: string, example: WAREHOUSE-MAIN }
        onHand: { type: integer }
        allocated: { type: integer }
        available:
          type: integer
          description: Computed as onHand - allocated, not stored.
        unitValue: { type: number, format: float }
        updatedAt: { type: string, format: date-time }
    StockAdjustmentDto:
      type: object
      required: [locationCode, quantityDelta, reason]
      properties:
        locationCode: { type: string }
        quantityDelta:
          type: integer
          description: Positive to increase On Hand, negative to decrease.
        reason: { type: string }
    SetBinLocationDto:
      type: object
      required: [locationCode, quantity]
      properties:
        locationCode: { type: string, example: WH-MAIN }
        quantity:
          type: integer
          minimum: 0
          description: Absolute number of units of this SKU in the bin — not a delta.
    BinLocation:
      type: object
      properties:
        binCode: { type: string }
        locationCode: { type: string }
        quantity: { type: integer }
    SalesVelocity:
      type: object
      properties:
        unitsPerDay: { type: number, format: float }
        windowDays: { type: integer }
        computedAt: { type: string, format: date-time }
    ValuationReport:
      type: object
      properties:
        asOf: { type: string, format: date-time }
        totalValue: { type: number, format: float }
        byProduct:
          type: array
          items:
            type: object
            properties:
              sku: { type: string }
              productName: { type: string }
              onHand: { type: integer }
              unitCost: { type: number, format: float }
              totalValue: { type: number, format: float }
