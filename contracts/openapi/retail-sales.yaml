info:
  title: Retail Sales (POS) Service
  description: Point-of-sale transaction engine (FR-6.x). Checks and reserves stock
    with Inventory over gRPC before completing a sale, publishes ItemSold/ItemReturned.
  version: 0.1.0
  contact: {}
tags: []
servers:
- url: http://localhost:3006
components:
  schemas:
    CreateProductDto:
      type: object
      properties:
        sku:
          type: string
          example: SKU-1
        name:
          type: string
          example: Oak Chair
        unitPrice:
          type: number
          description: Retail selling price per unit
          example: 149.99
        taxRatePct:
          type: number
          description: Sales tax rate, as a percentage
          example: 7.5
      required:
      - sku
      - name
      - unitPrice
    UpdateProductDto:
      type: object
      properties:
        name:
          type: string
          example: Oak Chair
        unitPrice:
          type: number
          description: Retail selling price per unit
          example: 149.99
        taxRatePct:
          type: number
          description: Sales tax rate, as a percentage
          example: 7.5
    CreatePromotionDto:
      type: object
      properties:
        discountPct:
          type: number
          description: Percentage discount off the subtotal
          example: 15
        startsAt:
          type: string
          example: '2026-09-01T00:00:00.000Z'
        endsAt:
          type: string
          example: '2026-09-30T23:59:59.000Z'
      required:
      - discountPct
      - startsAt
      - endsAt
    CheckoutLineDto:
      type: object
      properties:
        sku:
          type: string
          example: SKU-1
        quantity:
          type: number
          minimum: 1
          example: 1
      required:
      - sku
      - quantity
    CheckoutPaymentDto:
      type: object
      properties:
        method:
          type: string
          enum:
          - CASH
          - CARD
          - GIFT_CARD
        amount:
          type: number
          minimum: 0
      required:
      - method
      - amount
    CheckoutDto:
      type: object
      properties:
        storeId:
          type: string
          example: STORE-1
        registerId:
          type: string
          example: REG-1
        locationCode:
          type: string
          description: Inventory location code this register sells from (matches Inventory's
            locationCode)
          example: STORE-1
        lines:
          type: array
          items:
            $ref: '#/components/schemas/CheckoutLineDto'
        payments:
          type: array
          items:
            $ref: '#/components/schemas/CheckoutPaymentDto'
      required:
      - storeId
      - registerId
      - locationCode
      - lines
      - payments
    ReturnLineDto:
      type: object
      properties:
        transactionLineId:
          type: string
        quantityReturned:
          type: number
          minimum: 1
      required:
      - transactionLineId
      - quantityReturned
    CreateReturnDto:
      type: object
      properties:
        originalTransactionId:
          type: string
        storeId:
          type: string
          example: STORE-1
        registerId:
          type: string
          example: REG-1
        lines:
          type: array
          items:
            $ref: '#/components/schemas/ReturnLineDto'
      required:
      - originalTransactionId
      - storeId
      - registerId
      - lines
