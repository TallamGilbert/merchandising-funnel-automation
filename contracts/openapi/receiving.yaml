openapi: 3.0.3
info:
  title: Receiving Service
  description: >
    The validation point between what was ordered and what physically
    arrived (FR-3.1–FR-3.8). Learns which deliveries to expect from the
    PurchaseOrderApproved event (FR-3.7), validates each delivery against
    Procurement (REST), records what dock staff actually scan, flags
    shortages / overages / damage (FR-3.3), quarantines damaged goods
    (FR-3.4, D-2 — flag only), and publishes GoodsReceived once a GRN is
    finalized (FR-3.6). Never stores or exposes cost data and never decides
    storage location. Owns its own Postgres database.
  version: 0.1.0
servers:
  - url: http://localhost:3004
tags:
  - name: health
  - name: expected-deliveries
  - name: goods-received-notes
paths:
  /health:
    get:
      tags: [health]
      summary: Liveness/readiness probe. Always reachable regardless of feature flag state.
      responses:
        "200":
          description: Service is up.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  service: { type: string, example: receiving }
                  timestamp: { type: string, format: date-time }
  /expected-deliveries:
    get:
      tags: [expected-deliveries]
      summary: >
        List deliveries Receiving expects, built from consumed
        PurchaseOrderApproved events (FR-3.7).
      parameters:
        - in: query
          name: status
          schema: { $ref: "#/components/schemas/ExpectedDeliveryStatus" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ExpectedDelivery" }
  /expected-deliveries/{poNumber}:
    get:
      tags: [expected-deliveries]
      summary: Get one expected delivery and its remaining open quantities
      parameters:
        - $ref: "#/components/parameters/PoNumber"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExpectedDelivery" }
        "404": { description: No expected delivery for that PO number. }
  /goods-received-notes:
    get:
      tags: [goods-received-notes]
      summary: List Goods Received Notes
      parameters:
        - in: query
          name: status
          schema: { $ref: "#/components/schemas/GoodsReceivedNoteStatus" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/GoodsReceivedNote" }
    post:
      tags: [goods-received-notes]
      summary: >
        Open a draft GRN when a truck arrives (FR-3.1). Calls Procurement
        (REST) to confirm an open, approved PO exists, then pre-populates one
        GOOD line per SKU still outstanding on that PO.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateGoodsReceivedNoteDto" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GoodsReceivedNote" }
        "404": { description: Procurement has no open approved PO with that number. }
        "503": { description: Procurement is unreachable. }
  /goods-received-notes/{id}:
    get:
      tags: [goods-received-notes]
      summary: Get a GRN and its lines
      parameters:
        - $ref: "#/components/parameters/GoodsReceivedNoteId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GoodsReceivedNote" }
        "404": { description: Not found }
  /goods-received-notes/{id}/scans:
    post:
      tags: [goods-received-notes]
      summary: >
        Record a barcode scan against a draft GRN (FR-3.2, FR-3.8).
        Quantities accumulate per (sku, condition). The response's
        `discrepancyType` on each line is recomputed immediately so dock
        staff see shortages, overages and damage at time of scan (FR-3.3).
        DAMAGED lines are quarantined (FR-3.4). A SKU that is not on the PO
        is accepted and flagged OVERAGE.
      parameters:
        - $ref: "#/components/parameters/GoodsReceivedNoteId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecordScanDto" }
      responses:
        "201":
          description: Scan recorded; returns the updated GRN.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GoodsReceivedNote" }
        "400": { description: GRN is already finalized. }
        "404": { description: Not found }
  /goods-received-notes/{id}/finalize:
    post:
      tags: [goods-received-notes]
      summary: >
        Finalize a draft GRN (FR-3.5) — it becomes the immutable
        system-of-record for possession. Updates the expected delivery's
        received quantities and publishes GoodsReceived (FR-3.6). The event
        carries physical facts only — never unit cost.
      parameters:
        - $ref: "#/components/parameters/GoodsReceivedNoteId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GoodsReceivedNote" }
        "400": { description: GRN is already finalized, or nothing was scanned. }
        "404": { description: Not found }
components:
  parameters:
    PoNumber:
      in: path
      name: poNumber
      required: true
      schema: { type: string, example: PO-1001 }
    GoodsReceivedNoteId:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }
  schemas:
    ExpectedDeliveryStatus:
      type: string
      enum: [EXPECTED, PARTIALLY_RECEIVED, RECEIVED]
    GoodsReceivedNoteStatus:
      type: string
      enum: [DRAFT, FINALIZED]
    GoodsReceivedNoteCondition:
      type: string
      enum: [GOOD, DAMAGED]
    GoodsReceivedNoteDiscrepancyType:
      type: string
      enum: [NONE, SHORTAGE, OVERAGE, DAMAGE]
    ExpectedDelivery:
      type: object
      properties:
        id: { type: string, format: uuid }
        poNumber: { type: string, example: PO-1001 }
        supplierId: { type: string }
        supplierName: { type: string }
        status: { $ref: "#/components/schemas/ExpectedDeliveryStatus" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        lines:
          type: array
          items: { $ref: "#/components/schemas/ExpectedDeliveryLine" }
    ExpectedDeliveryLine:
      type: object
      description: No cost fields by design — Receiving never sees the value of goods.
      properties:
        id: { type: string, format: uuid }
        sku: { type: string }
        productName: { type: string }
        quantityOrdered: { type: integer }
        quantityReceived: { type: integer }
    CreateGoodsReceivedNoteDto:
      type: object
      required: [poNumber, receivedAtLocation, receivedById]
      properties:
        poNumber: { type: string, example: PO-1001 }
        receivedAtLocation:
          type: string
          description: Location code of the dock the goods arrived at (matches Inventory's locationCode).
          example: WH-MAIN
        receivedById: { type: string, description: User id of the dock worker. }
    RecordScanDto:
      type: object
      required: [sku, quantity, condition]
      properties:
        sku: { type: string }
        quantity: { type: integer, minimum: 1 }
        condition: { $ref: "#/components/schemas/GoodsReceivedNoteCondition" }
        notes: { type: string }
    GoodsReceivedNote:
      type: object
      properties:
        id: { type: string, format: uuid }
        goodsReceivedNoteNumber: { type: string, example: GRN-1001 }
        poNumber: { type: string }
        supplierId: { type: string }
        receivedAtLocation: { type: string }
        receivedById: { type: string }
        status: { $ref: "#/components/schemas/GoodsReceivedNoteStatus" }
        finalizedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        lines:
          type: array
          items: { $ref: "#/components/schemas/GoodsReceivedNoteLine" }
    GoodsReceivedNoteLine:
      type: object
      properties:
        id: { type: string, format: uuid }
        sku: { type: string }
        productName: { type: string }
        quantityOrdered:
          type: integer
          description: Outstanding quantity on the PO when the GRN was opened. 0 on DAMAGED lines and on SKUs not on the PO.
        quantityReceived: { type: integer }
        condition: { $ref: "#/components/schemas/GoodsReceivedNoteCondition" }
        discrepancyType: { $ref: "#/components/schemas/GoodsReceivedNoteDiscrepancyType" }
        quarantined:
          type: boolean
          description: True for DAMAGED lines (FR-3.4). Terminal flag only in v1 (D-2).
        notes: { type: string, nullable: true }
