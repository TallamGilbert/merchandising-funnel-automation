        required: false
        in: query
        schema:
          type: boolean
      responses:
        '200':
          description: ''
      tags:
      - locations
    post:
      operationId: LocationsController_create
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLocationDto'
      responses:
        '201':
          description: ''
      tags:
      - locations
  /locations/{code}:
    get:
      operationId: LocationsController_findOne
      parameters:
      - name: code
        required: true
        in: path
        schema:
          type: string
      responses:
        '200':
          description: ''
      tags:
      - locations
    patch:
      operationId: LocationsController_update
      parameters:
      - name: code
        required: true
        in: path
        schema:
          type: string
      requestBody:
        required: true
        content:
