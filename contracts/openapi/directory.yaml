      parameters:
      - name: role
        required: false
        in: query
        description: One role, or several comma-separated (MANAGER,OWNER)
        schema:
          type: string
      - name: locationCode
        required: false
        in: query
        schema:
          type: string
      - name: includeInactive
        required: false
        in: query
        schema:
