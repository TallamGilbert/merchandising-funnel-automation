info:
  title: Directory Service
  description: Reference directory of staff (with roles), stores/warehouses and registers
    (D-10). Generated from the live /docs-json.
  version: 0.1.0
  contact: {}
tags: []
servers:
- url: http://localhost:3009
components:
  schemas:
    CreateLocationDto:
      type: object
      properties:
        code:
          type: string
          example: STORE-3
          description: Uppercase code used by every other service
        name:
          type: string
          example: Karen Showroom
        type:
          type: string
          enum:
          - STORE
          - WAREHOUSE
      required:
      - code
      - name
      - type
    UpdateLocationDto:
      type: object
      properties:
        name:
          type: string
        active:
          type: boolean
    CreateRegisterDto:
      type: object
      properties:
        code:
          type: string
          example: REG-3
          description: Unique within its store
        name:
          type: string
          example: Till 3 (entrance)
      required:
      - code
      - name
    CreateStaffDto:
      type: object
      properties:
        id:
          type: string
          example: cashier-amy
          description: Identifier other services record against this person
        name:
          type: string
          example: Amy Wanjiru
        role:
          type: string
          enum:
          - OWNER
          - MANAGER
          - CASHIER
          - WAREHOUSE_STAFF
        locationCode:
          type: string
          example: STORE-1
          description: Home store/warehouse
      required:
      - id
      - name
      - role
    UpdateStaffDto:
      type: object
      properties:
        name:
          type: string
        role:
          type: string
          enum:
          - OWNER
          - MANAGER
          - CASHIER
          - WAREHOUSE_STAFF
        locationCode:
          type: object
          nullable: true
          description: null clears the home location
        active:
          type: boolean
