        '200':
          description: ''
      tags:
      - locations
  /locations/{code}/registers:
    post:
      operationId: LocationsController_addRegister
      parameters:
      - name: code
        required: true
        in: path
        schema:
          type: string
      requestBody:
        required: true
        content:
