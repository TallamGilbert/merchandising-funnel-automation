info:
  title: Directory Service
  description: Reference directory of staff (with roles), stores/warehouses and registers
    (D-10). Generated from the live /docs-json.
  version: 0.1.0
  contact: {}
tags: []
servers:
- url: http://localhost:3009
components:
  schemas:
    CreateLocationDto:
      type: object
      properties:
        code:
          type: string
          example: STORE-3
          description: Uppercase code used by every other service
        name:
          type: string
          example: Karen Showroom
        type:
          type: string
          enum:
          - STORE
          - WAREHOUSE
      required:
      - code
      - name
      - type
    UpdateLocationDto:
      type: object
      properties:
        name:
          type: string
        active:
          type: boolean
    DeactivationIssue:
      type: object
      required: [kind, message]
      properties:
        kind:
          type: string
          enum: [STOCK_ON_HAND, OPEN_BUSINESS_DAYS, STAFF_ASSIGNED, TRANSFERS_IN_PROGRESS, DELIVERIES_IN_PROGRESS, CHECK_FAILED]
        message:
          type: string
    DeactivationCheck:
      type: object
      required: [blockers, warnings]
      properties:
        blockers:
          description: Stop the deactivation (also enforced on PATCH).
          type: array
          items:
            $ref: '#/components/schemas/DeactivationIssue'
        warnings:
          description: Shown for the manager to confirm past.
          type: array
          items:
            $ref: '#/components/schemas/DeactivationIssue'
    CreateRegisterDto:
      type: object
      properties:
        code:
          type: string
          example: REG-3
          description: Unique within its store
        name:
          type: string
          example: Till 3 (entrance)
      required:
      - code
      - name
    CreateStaffDto:
      type: object
      properties:
        id:
          type: string
          example: cashier-amy
          description: Identifier other services record against this person
        name:
          type: string
          example: Amy Wanjiru
        role:
          type: string
          enum:
          - OWNER
          - MANAGER
          - BUYER
          - ACCOUNTANT
          - CASHIER
          - WAREHOUSE_STAFF
        locationCode:
          type: string
          example: STORE-1
          description: Home store/warehouse
      required:
      - id
      - name
      - role
    UpdateStaffDto:
      type: object
      properties:
        name:
          type: string
        role:
          type: string
          enum:
          - OWNER
          - MANAGER
          - BUYER
          - ACCOUNTANT
          - CASHIER
          - WAREHOUSE_STAFF
        locationCode:
          type: object
          nullable: true
          description: null clears the home location
        active:
          type: boolean
    LoginDto:
      type: object
      properties:
        staffId:
          type: string
          example: mgr-sam
          description: Staff id
        password:
          type: string
      required:
      - staffId
      - password
    ChangePasswordDto:
      type: object
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 8
      required:
      - currentPassword
      - newPassword
