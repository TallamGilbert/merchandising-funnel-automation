# Generated from the running service: curl localhost:3007/docs-json (see CONTRIBUTING.md, NFR-4).
openapi: 3.0.0
paths:
  /health:
    get:
      operationId: HealthController_check
      parameters: []
      responses:
        '200':
          description: Service is up.
      tags:
      - health
  /stores/{storeId}/ledger:
    get:
      operationId: LedgerController_get
      parameters:
      - name: storeId
        required: true
        in: path
        schema:
          type: string
      - name: businessDate
        required: true
        in: query
        schema:
          type: string
      responses:
        '200':
          description: ''
      tags:
      - ledger
  /stores/{storeId}/daily-close:
    get:
      operationId: DailyCloseController_get
      parameters:
      - name: storeId
        required: true
        in: path
        schema:
          type: string
      - name: businessDate
        required: true
        in: query
        schema:
          type: string
      responses:
        '200':
          description: ''
      tags:
      - daily-close
  /stores/{storeId}/open-days:
    get:
      operationId: DailyCloseController_openDays
      summary: Business dates the store took sales on but hasn't closed (Directory checks this before deactivating it)
      parameters:
      - name: storeId
        required: true
        in: path
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                required: [storeId, businessDates]
                properties:
                  storeId:
                    type: string
                  businessDates:
                    type: array
                    items:
                      type: string
                      example: '2026-10-31'
      tags:
      - daily-close
  /stores/{storeId}/daily-close/count:
    post:
      operationId: DailyCloseController_recordCount
      parameters:
      - name: storeId
        required: true
        in: path
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordCountDto'
      responses:
        '201':
          description: ''
      tags:
      - daily-close
  /stores/{storeId}/daily-close/explain:
    post:
      operationId: DailyCloseController_explain
      parameters:
      - name: storeId
        required: true
        in: path
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExplainDiscrepancyDto'
      responses:
        '201':
          description: ''
      tags:
      - daily-close
  /stores/{storeId}/daily-close/close:
    post:
      operationId: DailyCloseController_close
      parameters:
      - name: storeId
        required: true
        in: path
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloseDailyDto'
      responses:
        '201':
          description: ''
      tags:
      - daily-close
info:
  title: Sales Audit Service
  description: Cash-drawer reconciliation against POS transactions (FR-7.x). Keeps
    a running expected total from ItemSold, blocks store close until discrepancies
    are explained.
  version: 0.1.0
  contact: {}
tags: []
servers:
- url: http://localhost:3007
components:
  schemas:
    RecordCountDto:
      type: object
      properties:
        businessDate:
          type: string
          example: '2026-09-24'
        actualCountedTotal:
          type: number
          description: Manager's physical count across all tills (FR-7.2)
      required:
      - businessDate
      - actualCountedTotal
    ExplainDiscrepancyDto:
      type: object
      properties:
        businessDate:
          type: string
          example: '2026-09-24'
        explanation:
          type: string
          description: Manager's explanation for the over/short (FR-7.4)
      required:
      - businessDate
      - explanation
    CloseDailyDto:
      type: object
      properties:
        businessDate:
          type: string
          example: '2026-09-24'
      required:
      - businessDate
